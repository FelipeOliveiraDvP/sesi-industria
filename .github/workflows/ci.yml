name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm frontend:typecheck

      - name: Build frontend
        run: pnpm frontend:build
        env:
          VITE_API_BASE_URL: https://api.example

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore backend dependencies
        run: dotnet restore

      - name: Build backend
        run: dotnet build --configuration Release --no-restore

      - name: Test backend with disposable PostgreSQL
        run: dotnet test --configuration Release --no-build

  containers:
    name: Container smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run deployment image smoke tests
        run: bash scripts/smoke-deployment.sh
